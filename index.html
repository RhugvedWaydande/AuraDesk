<!doctype html>
<!-- index.html — the single page of this Single Page Application (SPA).
     React takes over the <div id="root"> and renders everything inside it. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraDesk — AI Customer Support Agent</title>
    <!-- Inter: the go-to font of modern SaaS products (falls back to system fonts offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite injects the bundled JavaScript here -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
